name: NextUI test pak

# Builds the throwaway RG SP test pak (nextui/spike) and publishes it as a pre-release.
# Pre-releases are ignored by the Android updater, and the tag prefix keeps it apart from real releases.
on:
  workflow_dispatch:
  push:
    tags: ["nextui-test-*"]

permissions:
  contents: write

env:
  # Same checksum-pinned NextUI/TrimUI toolchain the PokeDaisy H700 builds use, via PokeDaisy's own setup script.
  POKEDAISY_SHA: 135ac809a597230c1fe3ad6359ae0fe81e233583
  FFMPEG_TAG: n6.1.2  # matches the desktop test build; 7.1 minimal builds miss aom_film_grain

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y python3-pil fonts-dejavu-core zip

      - name: Cache toolchain
        id: tc
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/trimui-sdk/cross
          key: nextui-toolchain-${{ env.POKEDAISY_SHA }}

      - name: Toolchain
        run: |
          if [ ! -d "$RUNNER_TEMP/trimui-sdk/cross/x86_64-aarch64-nextui-linux-gnu" ]; then
            curl -fsSL "https://raw.githubusercontent.com/lidor30/pokedaisy/$POKEDAISY_SHA/linux/setup_trimui_sdk.py" \
              -o "$RUNNER_TEMP/setup_trimui_sdk.py"
            python3 "$RUNNER_TEMP/setup_trimui_sdk.py" "$RUNNER_TEMP/trimui-sdk"
          fi
          TC="$RUNNER_TEMP/trimui-sdk/cross/x86_64-aarch64-nextui-linux-gnu"
          ls "$TC/aarch64-nextui-linux-gnu/libc/usr/include/SDL2/SDL.h"
          echo "TC=$TC" >> "$GITHUB_ENV"

      - name: Cache FFmpeg
        id: ff
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ffmpeg
          key: ffmpeg-h700-${{ env.FFMPEG_TAG }}-${{ hashFiles('.github/workflows/nextui-test.yml') }}-${{ env.POKEDAISY_SHA }}

      - name: FFmpeg (static, only what the pak needs)
        if: steps.ff.outputs.cache-hit != 'true'
        run: |
          git clone -q --depth 1 -b "$FFMPEG_TAG" https://github.com/FFmpeg/FFmpeg.git "$RUNNER_TEMP/ffsrc"
          cd "$RUNNER_TEMP/ffsrc"
          ./configure --prefix="$RUNNER_TEMP/ffmpeg" \
            --enable-cross-compile --arch=aarch64 --target-os=linux \
            --cross-prefix="$TC/bin/aarch64-nextui-linux-gnu-" --sysroot="$TC/aarch64-nextui-linux-gnu/libc" \
            --extra-cflags="-mcpu=cortex-a53 -O2" \
            --enable-static --disable-shared --enable-pic --enable-pthreads \
            --disable-programs --disable-doc --disable-avdevice --disable-avfilter --disable-autodetect \
            --disable-everything --enable-network \
            --enable-protocol=http,tcp,file \
            --enable-demuxer=hls,mpegts,mp3,aac,mov \
            --enable-decoder=h264,aac,aac_fixed,mp3,mp3float \
            --enable-parser=h264,aac,aac_latm,mpegaudio \
            --enable-swscale --enable-swresample
          make -j"$(nproc)" install

      - name: Build
        working-directory: nextui/spike
        run: |
          python3 ../tools/make_font.py /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf font.h font_small:20 font_big:56
          make CROSS=1 TC="$TC" FFMPEG="$RUNNER_TEMP/ffmpeg"
          file sleep-shuffle-test
          echo "Needs these shared libraries:"
          "$TC/bin/aarch64-nextui-linux-gnu-readelf" -d sleep-shuffle-test | grep NEEDED
          echo "Highest glibc symbol version:"
          "$TC/bin/aarch64-nextui-linux-gnu-objdump" -T sleep-shuffle-test | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1

      - name: Package and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in nextui-test-*) ;; *) TAG="nextui-test-${GITHUB_RUN_NUMBER}" ;; esac
          SD="$RUNNER_TEMP/sd"
          PAK="$SD/Tools/h700/Sleep Shuffle Test.pak"
          mkdir -p "$PAK"
          cp nextui/spike/sleep-shuffle-test nextui/spike/launch.sh "$PAK/"
          chmod +x "$PAK/sleep-shuffle-test" "$PAK/launch.sh"
          (cd "$SD" && zip -qr "$RUNNER_TEMP/SleepShuffleTest-h700.zip" Tools)
          gh release create "$TAG" "$RUNNER_TEMP/SleepShuffleTest-h700.zip" --prerelease --target "$GITHUB_SHA" \
            --title "RG SP test pak ($TAG)" \
            --notes "Throwaway test build for the Anbernic RG SP (NextUI H700). Unzip at the root of the NextUI SD card. See nextui/spike/README.md."
